blueprint:
  name: 🗓️⏰ Zeitschaltuhr mit Schaltbestätigung
  author: Torsten Wilms
  source_url: https://github.com/Toutzn/ha-blueprints/blob/main/blueprints/automation/zeitschaltuhr_mit_bestaetigung.yaml
  homeassistant:
    min_version: "2024.10.0"
  description: >-
    Schaltet beliebige Entitäten nach einer oder mehreren Zeitquellen ein und aus – und
    prüft danach nach, ob es wirklich geklappt hat.


    **Zeitquelle** ist jede Entität mit `on`/`off`: ein `schedule.*`-Helfer, ein
    Template-Binärsensor für Sonnenauf-/-untergang, eine Kalender-Entität. Der Blueprint
    braucht einen abfragbaren Zustand, kein Ereignis – nur so kann er nach einem
    Neustart nachholen, was er verpasst hat.


    **Ablauf:** Master-Schalter an? → Zeitschaltuhr aktiv? → sagen die Zeitquellen „an"
    oder „aus"? → weicht der Ist-Zustand vom Soll ab? → schalten, warten, nachprüfen,
    bei Bedarf wiederholen → Erfolg oder Fehlschlag melden.


    **Selbstheilend:** Zusätzlich zu den Schaltzeitpunkten prüft die Automation
    zyklisch und nach jedem Home-Assistant-Neustart nach. Damit fallen verlorene
    Funkbefehle, kurz nicht erreichbare Aktoren und verpasste Trigger (Neustart,
    Reload) nicht mehr durchs Raster.


    **Zwei Ebenen:** Der *Master-Schalter* ist der Stecker – ist er aus, gilt sein
    eigenes Verhalten und hat Vorrang. Die *Zeitschaltuhr aktiv* ist die Betriebsart –
    ist sie aus, gilt ihr eigenes Verhalten. Typische Kombination: Master aus =
    Zwangs-Aus, Betriebsart aus = Handbetrieb.


    **Meldungen:** Für Push aufs Handy genügt es, die Geräte auszuwählen – getrennt
    für Erfolg und Fehlschlag. Zusätzlich lassen sich beliebige eigene Aktionen für
    beide Fälle hinterlegen.


    **Schaltrichtung:** Die Zeitquellen dürfen auch nur in eine Richtung wirken.
    „Nur ausschalten" macht aus der Zeitschaltuhr eine Sperre: innerhalb des Fensters
    schaltest du frei, außerhalb wird konsequent abgeschaltet. „Nur einschalten" ist
    das Gegenstück.


    **Wichtig zur Nachprüfung:** Solange die Zeitschaltuhr aktiv ist, setzt die
    zyklische Nachprüfung den Soll-Zustand auch gegen manuelles Schalten durch.
    Für Handbetrieb die Betriebsart ausschalten – oder die Nachprüfung deaktivieren.
  domain: automation

  input:
    zeit:
      name: Zeitsteuerung
      icon: mdi:calendar-clock
      collapsed: false
      input:
        zeitquellen:
          name: Zeitquellen
          description: >-
            Eine oder mehrere Entitäten, deren Zustand den Soll-Zustand vorgibt:
            `on` = Ziel-Entitäten sollen an sein, `off` = aus.


            Üblich ist ein `schedule.*`-Helfer (Wochentage und mehrere Blöcke pro Tag
            konfigurierst du direkt darin). Es geht aber jede Entität mit `on`/`off` –
            etwa ein Template-Binärsensor für Sonnenauf- und -untergang oder eine
            Kalender-Entität.


            **Leer lassen**, wenn das eingebaute Zeitfenster unten genügt – Sonnenuntergang,
            Sonnenaufgang und feste Uhrzeiten brauchen hier nichts.


            WICHTIG: Eine Quelle muss einen abfragbaren Zustand haben, kein Ereignis.
            `sun.sun` selbst passt NICHT (dessen Zustand ist `above_horizon` /
            `below_horizon`), ebenso wenig `person` oder `device_tracker` (`home` /
            `not_home`) – dafür einen Template-Binärsensor anlegen. Rezepte stehen in
            der Doku.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: schedule
                - domain: binary_sensor
                - domain: input_boolean
                - domain: switch
                - domain: light
                - domain: fan
                - domain: calendar
                - domain: group
                - domain: automation

        zeitquellen_verknuepfung:
          name: Verknüpfung mehrerer Zeitquellen
          description: >-
            Nur relevant, wenn oben mehr als eine Quelle gewählt ist. ODER = zwei
            Zeitfenster addieren. UND = Bedingungen kombinieren, z. B. Zeitfenster
            zusammen mit Anwesenheit.
          default: oder
          selector:
            select:
              mode: list
              options:
                - label: "ODER – eine Quelle on genügt"
                  value: oder
                - label: "UND – alle Quellen müssen on sein"
                  value: und

        schaltrichtung:
          name: Schaltrichtung
          description: >-
            Ob die Zeitquellen beide Richtungen vorgeben dürfen oder nur eine.


            „Nur ausschalten" macht aus der Zeitschaltuhr eine Sperre: im Fenster
            bleibt das Schalten dir überlassen, außerhalb wird konsequent
            abgeschaltet. Typisch für Außenlicht, das tagsüber nichts zu suchen hat –
            die Zeitquelle ist dann ein Binärsensor „es ist dunkel".


            „Nur einschalten" ist das Gegenstück: die Automatik schaltet ein und
            überlässt dir das Ausschalten.


            Betrifft **nur** die Zeitquellen. Master-Schalter und Betriebsart behalten
            ihr eigenes Verhalten – ein dort eingestelltes Zwangs-Aus greift weiterhin.
          default: beides
          selector:
            select:
              mode: list
              options:
                - label: "Beides – Zeitquellen schalten ein und aus"
                  value: beides
                - label: "Nur ausschalten – außerhalb des Fensters wird abgeschaltet"
                  value: nur_ausschalten
                - label: "Nur einschalten – im Fenster wird eingeschaltet"
                  value: nur_einschalten

    fenster:
      name: Eingebautes Zeitfenster
      icon: mdi:weather-sunset
      collapsed: false
      input:
        fenster_start:
          name: Einschalten ab
          description: >-
            Der Beginn des Fensters. „Kein Fenster" heißt: es zählen nur die Zeitquellen
            oben.


            Sonnenuntergang und Sonnenaufgang werden über die Sonnenhöhe bestimmt, nicht
            über eine Uhrzeit – damit wandert die Schaltzeit über das Jahr korrekt mit.
          default: keins
          selector:
            select:
              mode: list
              options:
                - label: "Kein Fenster – nur die Zeitquellen oben"
                  value: keins
                - label: "Sonnenuntergang"
                  value: sonnenuntergang
                - label: "Feste Uhrzeit"
                  value: uhrzeit

        fenster_start_uhrzeit:
          name: Uhrzeit für den Beginn
          description: >-
            Nur wirksam, wenn oben „Feste Uhrzeit" gewählt ist.
          default: "23:00:00"
          selector:
            time:

        fenster_ende:
          name: Ausschalten ab
          description: >-
            Das Ende des Fensters. Beide Felder – Beginn und Ende – müssen gesetzt sein,
            sonst gilt das Fenster als nicht konfiguriert und wird ignoriert.


            Über Mitternacht ist ausdrücklich erlaubt: „ab Sonnenuntergang, aus um 01:00"
            oder „ab 23:00, aus bei Sonnenaufgang" werden richtig gerechnet.
          default: keins
          selector:
            select:
              mode: list
              options:
                - label: "Kein Fenster – nur die Zeitquellen oben"
                  value: keins
                - label: "Sonnenaufgang"
                  value: sonnenaufgang
                - label: "Feste Uhrzeit"
                  value: uhrzeit

        fenster_ende_uhrzeit:
          name: Uhrzeit für das Ende
          description: >-
            Nur wirksam, wenn oben „Feste Uhrzeit" gewählt ist. Eine Uhrzeit vor 12:00
            wird als „nach Mitternacht" verstanden, das Fenster läuft dann über den
            Tageswechsel.
          default: "01:00:00"
          selector:
            time:

        daemmerung_schwelle:
          name: Dämmerungsschwelle
          description: >-
            Ab welcher Sonnenhöhe es als dunkel gilt – der Feinregler für
            Sonnenuntergang und Sonnenaufgang. `0` ist der geometrische Sonnenauf- und
            -untergang; negative Werte schieben nach hinten in die Dämmerung.


            Anhaltspunkte für Mitteleuropa: `0` = exakt Sonnenuntergang,
            `-2` = kurz danach (Vorgabe), `-6` = Ende der bürgerlichen Dämmerung,
            es ist deutlich dunkel.
          default: -2
          selector:
            number:
              min: -12
              max: 6
              step: 0.5
              unit_of_measurement: "°"
              mode: slider

    schalter:
      name: Schalter und Betriebsart
      icon: mdi:toggle-switch-outline
      collapsed: false
      input:
        master_entitaeten:
          name: Master-Schalter (optional)
          description: >-
            Die oberste Ebene – sinnbildlich der Stecker der Zeitschaltuhr. Alle hier
            gewählten Entitäten müssen `on` sein, damit überhaupt etwas läuft, z. B.
            ein `input_boolean.poolsaison`. Hat Vorrang vor der Betriebsart. Leer
            lassen, wenn nicht benötigt.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: switch
                - domain: schedule

        verhalten_bei_master_aus:
          name: Verhalten bei ausgeschaltetem Master
          description: >-
            Was passiert, wenn ein Master-Schalter auf `off` steht. „Stecker gezogen"
            bedeutet üblicherweise, dass die Last aus soll.
          default: ausschalten
          selector:
            select:
              mode: list
              options:
                - label: "Zwangs-Aus – Ziel-Entitäten werden ausgeschaltet"
                  value: ausschalten
                - label: "Handbetrieb – Automatik hält sich komplett raus"
                  value: handbetrieb

        aktiv_schalter:
          name: Zeitschaltuhr aktiv (optional)
          description: >-
            Die Betriebsart. Alle hier gewählten Entitäten müssen `on` sein, damit die
            Zeitquellen regieren; sonst gilt das unten gewählte Verhalten.


            Leer lassen, wenn es keinen Handbetrieb geben soll – dann läuft die
            Automatik immer nach den Zeitquellen. Sinnvoll z. B. für eine reine
            Beleuchtungsschaltung, die nie von Hand übersteuert wird.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: switch
                - domain: schedule

        verhalten_bei_zeitschaltuhr_aus:
          name: Verhalten bei deaktivierter Zeitschaltuhr
          description: >-
            Was passiert, wenn die Betriebsart auf `off` steht. Handbetrieb heißt: der
            aktuelle Zustand bleibt unangetastet und du schaltest frei von Hand.
          default: handbetrieb
          selector:
            select:
              mode: list
              options:
                - label: "Handbetrieb – Automatik hält sich komplett raus"
                  value: handbetrieb
                - label: "Zwangs-Aus – Ziel-Entitäten werden ausgeschaltet"
                  value: ausschalten

    schalten:
      name: Schalten und Nachprüfen
      icon: mdi:check-decagram-outline
      collapsed: false
      input:
        ziele:
          name: Zu schaltende Entitäten
          description: >-
            Diese Entitäten werden geschaltet und einzeln auf Erfolg geprüft.
            Bewusst Entitäten statt Geräte: nur so lässt sich der Ist-Zustand
            zurücklesen.
          selector:
            entity:
              multiple: true
              filter:
                - domain: switch
                - domain: light
                - domain: input_boolean
                - domain: fan
                - domain: media_player

        pruefung_verzoegerung:
          name: Wartezeit vor der Nachprüfung
          description: >-
            Wie lange nach dem Schaltbefehl gewartet wird, bevor der Ist-Zustand
            geprüft wird. Bei Funk-Aktoren (Zigbee, Z-Wave, WLAN) lieber etwas
            großzügiger.
          default: 10
          selector:
            number:
              min: 2
              max: 120
              step: 1
              unit_of_measurement: Sekunden
              mode: slider

        max_versuche:
          name: Maximale Schaltversuche
          description: >-
            Wie oft der Schaltbefehl wiederholt wird, solange der Ist-Zustand nicht
            passt. Wiederholt wird nur für die Entitäten, die noch nicht reagiert haben.
          default: 5
          selector:
            number:
              min: 1
              max: 20
              step: 1
              mode: box

        nachpruefung:
          name: Zyklische Nachprüfung aktiv
          description: >-
            Prüft im Hintergrund laufend, ob Soll- und Ist-Zustand übereinstimmen,
            und korrigiert Abweichungen. Ausschalten, wenn du manuelles Schalten
            während des Zeitfensters erlauben willst.
          default: true
          selector:
            boolean:

        sync_intervall:
          name: Intervall der Nachprüfung
          description: >-
            Die Automation bricht sofort ab, wenn keine Abweichung besteht – ein
            kurzes Intervall kostet also praktisch keine Leistung.
          default: "/5"
          selector:
            select:
              options:
                - label: Jede Minute
                  value: "/1"
                - label: Alle 5 Minuten
                  value: "/5"
                - label: Alle 15 Minuten
                  value: "/15"
                - label: Alle 30 Minuten
                  value: "/30"

        ziel_trigger:
          name: Sofort nachregeln, wenn fremd geschaltet wird
          description: >-
            Horcht zusätzlich auf die Ziel-Entitäten selbst: wird eine davon von Hand,
            per Szene oder Sprachassistent geschaltet, bewertet die Automation sofort
            neu, statt bis zum nächsten Nachprüf-Intervall zu warten.


            Sinnvoll überall dort, wo die Automatik das letzte Wort haben soll – vor
            allem bei einer Sperre („nur ausschalten"), die sonst bis zu einem vollen
            Nachprüf-Intervall hinterherhinkt.


            Unabhängig von der zyklischen Nachprüfung; beides lässt sich einzeln
            an- und abschalten. Zu wissen: jeder eigene Schaltvorgang löst diesen
            Trigger ebenfalls aus. Der Folgelauf findet Soll = Ist und bricht sofort
            ab – er belegt aber einen Platz im Trace-Puffer (Standard 5 pro
            Automation).
          default: false
          selector:
            boolean:

    push:
      name: Push-Benachrichtigungen
      icon: mdi:cellphone-message
      collapsed: false
      input:
        push_geraete_erfolg:
          name: Push bei Erfolg an diese Geräte (optional)
          description: >-
            Geräte mit installierter Home-Assistant-App, die eine Push-Benachrichtigung
            erhalten, wenn erfolgreich geschaltet wurde. Leer lassen = kein Push bei
            Erfolg.
          default: []
          selector:
            device:
              integration: mobile_app
              multiple: true

        push_geraete_fehler:
          name: Push bei Fehlschlag an diese Geräte (optional)
          description: >-
            Geräte, die eine Push-Benachrichtigung erhalten, wenn der Schaltbefehl auch
            nach allen Versuchen nicht angekommen ist. Leer lassen = kein Push bei
            Fehlschlag.
          default: []
          selector:
            device:
              integration: mobile_app
              multiple: true

        push_titel:
          name: Titel der Push-Benachrichtigung
          description: >-
            Erscheint als Überschrift der Meldung. Bei mehreren Automationen aus diesem
            Blueprint hilft ein sprechender Titel beim Auseinanderhalten, z. B. „Pool".
          default: Zeitschaltuhr
          selector:
            text:

        fehler_melden:
          name: Fehlermeldungen bei der zyklischen Nachprüfung
          description: >-
            Ein dauerhaft nicht erreichbares Gerät – abgestecktes Zwischenstecker-Relais,
            zigbee2mqtt gestoppt – erzeugt sonst bei jedem Nachprüf-Durchlauf eine neue
            Meldung, im Standardintervall also alle 5 Minuten.


            „Unterdrücken" meldet nur, wenn ein echtes Ereignis der Auslöser war:
            Schaltzeitpunkt, Schalter oder Neustart. Korrigiert wird weiterhin bei jedem
            Durchlauf, und **Erfolgsmeldungen sind nicht betroffen** – die kommen auch aus
            der Nachprüfung heraus, also genau dann, wenn es endlich geklappt hat.
          default: ereignisse
          selector:
            select:
              mode: list
              options:
                - label: "Unterdrücken – nur bei Schaltzeitpunkt, Schalter oder Neustart"
                  value: ereignisse
                - label: "Auch bei jedem Nachprüf-Durchlauf melden"
                  value: immer

        push_kritisch:
          name: Fehlschlag als kritische Benachrichtigung
          description: >-
            Lässt den Fehler-Push auch bei stummgeschaltetem oder auf „Nicht stören"
            gestelltem Telefon durch. Setzt voraus, dass in der Companion-App die
            Berechtigung für kritische Hinweise erteilt ist. Gilt nur für den
            Fehlschlag, nie für den Erfolg.
          default: false
          selector:
            boolean:

    meldungen:
      name: Meldungen
      icon: mdi:bell-outline
      collapsed: true
      input:
        aktion_bei_erfolg:
          name: Aktion bei Erfolg
          description: >-
            Zusätzliche Aktion über den Push oben hinaus – läuft nur, wenn tatsächlich
            geschaltet wurde und alle Ziel-Entitäten den Soll-Zustand erreicht haben.
            Die vorgegebene Aktion schreibt lediglich ins HA-Logbuch; wer sie nicht
            braucht, kann sie löschen.


            Nutzbare Variablen: `soll_zustand` (`on`/`off`), `grund_text` (Auslöser im
            Klartext), `ziel_liste` (alle Ziele), `versuche` (Anzahl Schaltversuche).
          default:
            - action: logbook.log
              data:
                name: Zeitschaltuhr
                message: >-
                  {{ grund_text }}: auf '{{ soll_zustand }}' geschaltet
                  ({{ versuche }} Versuch(e)) – {{ ziel_liste | join(', ') }}
          selector:
            action: {}

        aktion_bei_fehler:
          name: Aktion bei Fehlschlag
          description: >-
            Zusätzliche Aktion über den Push oben hinaus – läuft, wenn nach allen
            Versuchen noch Entitäten den Soll-Zustand nicht erreicht haben. Die
            vorgegebene Aktion erzeugt die Glocken-Meldung in der HA-Oberfläche.


            Nutzbare Variablen: `soll_zustand`, `grund_text`, `restliche` (Entitäten,
            die nicht reagiert haben), `versuche`.
          default:
            - action: persistent_notification.create
              data:
                title: Zeitschaltuhr – Schaltfehler
                message: >-
                  {{ grund_text }}: konnte nach {{ versuche }} Versuch(en) nicht auf
                  '{{ soll_zustand }}' schalten – {{ restliche | join(', ') }}
          selector:
            action: {}

# ---------------------------------------------------------------------------

mode: queued
max: 10
max_exceeded: silent

triggers:
  # Regulärer Schaltzeitpunkt: eine Zeitquelle wechselt. Mit explizitem "to:", damit
  # reine Attributänderungen (z. B. next_event) die Automation nicht sinnlos starten.
  - trigger: state
    entity_id: !input zeitquellen
    to: "on"
    id: zeitquelle
  - trigger: state
    entity_id: !input zeitquellen
    to: "off"
    id: zeitquelle

  # Master oder Betriebsart geändert -> sofort neu bewerten
  - trigger: state
    entity_id: !input master_entitaeten
    to: ["on", "off"]
    id: schalter
  - trigger: state
    entity_id: !input aktiv_schalter
    to: ["on", "off"]
    id: schalter

  # Jemand hat an einer Ziel-Entität geschaltet - von Hand, per Szene, per Assistent.
  # Der Trigger ist immer aktiv; ob er verarbeitet wird, entscheidet "ziel_trigger"
  # weiter unten. Ein Trigger-Block lässt sich nicht per Eingabe abschalten.
  - trigger: state
    entity_id: !input ziele
    to: ["on", "off"]
    id: ziel

  # Kanten des eingebauten Fensters. Die Sonnen-Trigger hängen an der Dämmerungsschwelle,
  # nicht an "sunset"/"sunrise" - sonst würde eine Schwelle ungleich 0 erst beim nächsten
  # Nachprüf-Tick wirksam. Die beiden Zeit-Trigger feuern auch, wenn das Fenster gar nicht
  # benutzt wird; solche Läufe enden beim Soll-Ist-Vergleich, ohne zu schalten.
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: !input daemmerung_schwelle
    id: fenster
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: !input daemmerung_schwelle
    id: fenster
  - trigger: time
    at: !input fenster_start_uhrzeit
    id: fenster
  - trigger: time
    at: !input fenster_ende_uhrzeit
    id: fenster

  # Selbstheilung
  - trigger: homeassistant
    event: start
    id: neustart
  - trigger: time_pattern
    minutes: !input sync_intervall
    id: sync

conditions: []

variables:
  # ACHTUNG: Variablen auf dieser Ebene rendert Home Assistant zum TRIGGER-Zeitpunkt,
  # nicht beim Ausführen. Bei "mode: queued" wartet ein zweiter Lauf in der Schlange,
  # rechnet aber mit dem Zustand von vor der Wartezeit. Hier stehen deshalb nur
  # statische Eingaben - jede Entscheidung fällt unten in den Aktionen.
  v_quellen: !input zeitquellen
  v_verknuepfung: !input zeitquellen_verknuepfung
  v_richtung: !input schaltrichtung
  v_fenster_start: !input fenster_start
  v_fenster_ende: !input fenster_ende
  v_fenster_start_uhrzeit: !input fenster_start_uhrzeit
  v_fenster_ende_uhrzeit: !input fenster_ende_uhrzeit
  v_schwelle: !input daemmerung_schwelle
  v_ziel_trigger: !input ziel_trigger
  v_aktiv: !input aktiv_schalter
  v_master: !input master_entitaeten
  v_verhalten_master: !input verhalten_bei_master_aus
  v_verhalten_uhr: !input verhalten_bei_zeitschaltuhr_aus
  v_nachpruefung: !input nachpruefung
  v_max_versuche: !input max_versuche
  v_push_erfolg: !input push_geraete_erfolg
  v_push_fehler: !input push_geraete_fehler
  v_push_kritisch: !input push_kritisch
  v_fehler_melden: !input fehler_melden

  ziel_liste: !input ziele

actions:
  # 1. Zyklische Nachprüfung abgeschaltet? Dann nur echte Ereignisse verarbeiten.
  - alias: Nachprüfung respektieren
    condition: template
    value_template: >-
      {{ trigger is not defined
         or (trigger.id | default('manuell')) != 'sync'
         or v_nachpruefung }}

  # 1b. Ziel-Trigger nur verarbeiten, wenn er eingeschaltet ist. Steht hier und nicht
  #     in "conditions", weil bei "mode: queued" nichts abgebrochen wird - ein neuer
  #     Lauf reiht sich nur ein. (Bei "mode: restart" müsste es in "conditions".)
  - alias: Ziel-Trigger respektieren
    condition: template
    value_template: >-
      {{ trigger is not defined
         or (trigger.id | default('manuell')) != 'ziel'
         or v_ziel_trigger }}

  # 2. Lagebild ERST JETZT erheben - beim Ausführen, nicht beim Auslösen.
  #    Wartete dieser Lauf in der Warteschlange, hat der vorherige eventuell schon
  #    geschaltet; dann muss hier der neue Ist-Zustand herauskommen, nicht der alte.
  - alias: Soll-Zustand ermitteln
    variables:
      # Ist das eingebaute Fenster überhaupt konfiguriert? Beide Kanten müssen gesetzt
      # sein - ein halbes Fenster hat keinen definierten Zustand.
      fenster_konfiguriert: >-
        {{ v_fenster_start != 'keins' and v_fenster_ende != 'keins' }}

      # Liegt "jetzt" im eingebauten Fenster? Sonnenkanten laufen über die Sonnenhöhe,
      # Uhrzeit-Kanten über today_at(). Die Fälle über Mitternacht sind ODER-Fälle und
      # müssen je Tageshälfte beschrieben werden - "elevation < x" heißt schließlich
      # abends wie morgens "dunkel". Die Tageshälften-Klammer ist today_at('12:00').
      fenster_an: >-
        {%- if not fenster_konfiguriert -%}false
        {%- else -%}
        {%- set dunkel = (state_attr('sun.sun', 'elevation') | float(90)) < (v_schwelle | float(0)) -%}
        {%- set mittag = today_at('12:00') -%}
        {%- set jetzt = now() -%}
        {%- set s_zeit = today_at(v_fenster_start_uhrzeit) -%}
        {%- set e_zeit = today_at(v_fenster_ende_uhrzeit) -%}
        {%- if v_fenster_start == 'sonnenuntergang' and v_fenster_ende == 'sonnenaufgang' -%}
        {{ dunkel }}
        {%- elif v_fenster_start == 'sonnenuntergang' -%}
        {%- if e_zeit >= mittag -%}{{ mittag <= jetzt < e_zeit and dunkel }}
        {%- else -%}{{ (mittag <= jetzt and dunkel) or jetzt < e_zeit }}{%- endif -%}
        {%- elif v_fenster_ende == 'sonnenaufgang' -%}
        {%- if s_zeit >= mittag -%}{{ jetzt >= s_zeit or (jetzt < mittag and dunkel) }}
        {%- else -%}{{ s_zeit <= jetzt < mittag and dunkel }}{%- endif -%}
        {%- else -%}
        {%- if s_zeit < e_zeit -%}{{ s_zeit <= jetzt < e_zeit }}
        {%- else -%}{{ jetzt >= s_zeit or jetzt < e_zeit }}{%- endif -%}
        {%- endif -%}
        {%- endif -%}

      # Vorbedingung: haben alle Entscheidungs-Eingaben einen brauchbaren Zustand?
      # Beim HA-Start sind Entitäten kurz "unavailable" - dann darf NICHTS geschaltet
      # werden, sonst wird "weiß ich nicht" als "aus" missverstanden.
      eingaben_bekannt: >-
        {% set quellen = expand(v_quellen) | list %}
        {% set schalter = expand(v_master) | list + expand(v_aktiv) | list %}
        {{ (quellen | count > 0 or fenster_konfiguriert)
           and quellen | rejectattr('state', 'in', ['on', 'off']) | list | count == 0
           and schalter | rejectattr('state', 'in', ['on', 'off']) | list | count == 0 }}

      # Ebene 1: sind alle Master-Schalter "on"? (leere Liste = ja)
      master_ok: >-
        {{ expand(v_master) | selectattr('state', 'ne', 'on') | list | count == 0 }}

      # Ebene 2: sind alle Betriebsart-Schalter "on"? (leere Liste = ja)
      uhr_ok: >-
        {{ expand(v_aktiv) | selectattr('state', 'ne', 'on') | list | count == 0 }}

      # Ebene 3: sagen die Zeitquellen "an"? ODER = eine genügt, UND = alle müssen.
      # Das eingebaute Fenster zählt dabei wie eine weitere Zeitquelle mit.
      quelle_an: >-
        {% set an = expand(v_quellen) | selectattr('state', 'eq', 'on') | list | count %}
        {% set alle = expand(v_quellen) | list | count %}
        {% set an = an + (1 if (fenster_konfiguriert and fenster_an) else 0) %}
        {% set alle = alle + (1 if fenster_konfiguriert else 0) %}
        {{ an > 0 if v_verknuepfung == 'oder' else (alle > 0 and an == alle) }}

      # Soll-Zustand: 'on', 'off' oder 'egal' (= Automatik ist nicht zuständig).
      # Unbekannte Zustände zuerst, dann Master, dann Betriebsart, dann die Zeitquellen.
      soll_zustand: >-
        {% if not eingaben_bekannt %}egal{% elif not master_ok %}{{ 'off' if v_verhalten_master == 'ausschalten' else 'egal' }}{% elif not uhr_ok %}{{ 'off' if v_verhalten_uhr == 'ausschalten' else 'egal' }}{% elif quelle_an %}{{ 'egal' if v_richtung == 'nur_ausschalten' else 'on' }}{% else %}{{ 'egal' if v_richtung == 'nur_einschalten' else 'off' }}{% endif %}

      # Auslöser, maschinenlesbar
      grund: >-
        {% if not eingaben_bekannt %}unbekannt{% elif not master_ok %}master_aus{% elif not uhr_ok %}zeitschaltuhr_aus{% elif trigger is defined and (trigger.id | default('')) == 'ziel' %}nachgeregelt{% else %}zeitquelle{% endif %}

      # Zählt die Schaltversuche. Vorgabe 0, falls die Schleife gar nicht erst anläuft
      # (etwa weil alle Ziele unerreichbar sind).
      versuche: 0

      # Darf dieser Lauf Fehler melden? Nachprüf-Ticks schweigen auf Wunsch.
      melden_erlaubt: >-
        {{ v_fehler_melden == 'immer'
           or trigger is not defined
           or (trigger.id | default('manuell')) != 'sync' }}

      # Auslöser im Klartext, für Meldungen
      grund_text: >-
        {% if grund == 'unbekannt' %}Zustand nicht verfügbar{% elif grund == 'master_aus' %}Master-Schalter aus{% elif grund == 'zeitschaltuhr_aus' %}Zeitschaltuhr deaktiviert{% elif grund == 'nachgeregelt' %}Von Hand geschaltet{% else %}Zeitquelle{% endif %}

  # 3. Ist die Automatik überhaupt zuständig? ('egal' = Handbetrieb)
  - alias: Nur handeln, wenn ein Soll-Zustand definiert ist
    condition: template
    value_template: "{{ soll_zustand in ['on', 'off'] }}"

  # 4. Gibt es etwas zu tun oder zu melden? Fängt zugleich den Fall ab, dass ein
  #    vorheriger Lauf die Arbeit schon erledigt hat.
  #
  #    WICHTIG: "nicht im Soll" und "nicht erreichbar" sind zwei verschiedene Dinge.
  #    Ein Gerät mit Zustand 'unavailable' laesst sich nicht schalten - es wiederholt
  #    anzufunken kostet nur Zeit. Es wird deshalb getrennt gezählt und getrennt gemeldet.
  - alias: Nur handeln, wenn es etwas zu schalten oder zu melden gibt
    condition: template
    value_template: >-
      {% set schaltbar = expand(ziel_liste)
           | selectattr('state', 'in', ['on', 'off'])
           | selectattr('state', 'ne', soll_zustand) | list | count %}
      {% set weg = expand(ziel_liste)
           | rejectattr('state', 'in', ['on', 'off']) | list | count %}
      {{ schaltbar > 0 or (weg > 0 and melden_erlaubt) }}

  # 5. Schalten, warten, nachprüfen – und nur die Nachzügler erneut anstoßen.
  #    "while" statt "until": die Bedingung wird VOR jedem Durchgang geprüft. Gibt es
  #    nichts Schaltbares, läuft die Schleife null Mal - kein Leerbefehl, keine Wartezeit.
  - alias: Schalten mit Wiederholung
    repeat:
      sequence:
        # Zähler mitschreiben - "repeat.index" ist nach der Schleife nicht mehr verfügbar
        - variables:
            versuche: "{{ repeat.index }}"
        - action: "homeassistant.turn_{{ soll_zustand }}"
          continue_on_error: true
          target:
            entity_id: >-
              {{ expand(ziel_liste)
                 | selectattr('state', 'in', ['on', 'off'])
                 | selectattr('state', 'ne', soll_zustand)
                 | map(attribute='entity_id') | list }}
        - delay:
            seconds: !input pruefung_verzoegerung
      while:
        - condition: template
          value_template: >-
            {{ expand(ziel_liste)
                 | selectattr('state', 'in', ['on', 'off'])
                 | selectattr('state', 'ne', soll_zustand) | list | count > 0
               and repeat.index <= v_max_versuche }}

  # 6. Ergebnis auswerten - getrennt nach "reagiert nicht" und "gar nicht da"
  - variables:
      restliche: >-
        {{ expand(ziel_liste)
                 | selectattr('state', 'in', ['on', 'off'])
                 | selectattr('state', 'ne', soll_zustand)
                 | map(attribute='entity_id') | list }}
      nicht_erreichbar: >-
        {{ expand(ziel_liste)
                 | rejectattr('state', 'in', ['on', 'off'])
                 | map(attribute='entity_id') | list }}
      erfolg: >-
        {{ restliche | count == 0 and nicht_erreichbar | count == 0 }}

  # 7. Push an die ausgewählten Geräte. Leere Liste = keine Runde, kein Versand.
  - variables:
      # Erfolg geht immer raus. Fehler nur, wenn dieser Lauf melden darf.
      push_ziele: >-
        {% if erfolg %}{{ v_push_erfolg }}{% elif melden_erlaubt %}{{ v_push_fehler }}{% else %}{{ [] }}{% endif %}
      push_text: >-
        {% set n = versuche | int(0) %}{% set s = 'Schaltversuch' if n == 1 else 'Schaltversuchen' %}{% if erfolg %}{{ grund_text }}: auf '{{ soll_zustand }}' geschaltet – nach {{ n }} {{ s }}{% else %}{{ grund_text }}: {% if restliche | count > 0 %}{{ restliche | join(', ') }} reagiert nicht auf '{{ soll_zustand }}' (nach {{ n }} {{ s }}){% if nicht_erreichbar | count > 0 %}; {% endif %}{% endif %}{% if nicht_erreichbar | count > 0 %}nicht erreichbar: {{ nicht_erreichbar | join(', ') }}{% endif %}{% endif %}
      # Gleicher Tag pro Automation: eine neue Meldung ersetzt die vorige,
      # statt eine weitere Zeile im Mitteilungszentrum anzulegen.
      push_tag: "zeitschaltuhr_{{ ziel_liste | join('_') | slugify }}"
      push_extra: >-
        {% if not erfolg and v_push_kritisch %}{{ {'tag': push_tag, 'push': {'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}}} }}{% else %}{{ {'tag': push_tag} }}{% endif %}

  - alias: Push-Benachrichtigung senden
    repeat:
      for_each: "{{ push_ziele }}"
      sequence:
        # Der Notify-Dienst der Companion-App heisst notify.mobile_app_<Geraetename>.
        # device_attr(...,'name') liefert den Namen bei der Registrierung - genau den,
        # aus dem der Dienstname gebildet wurde (nicht die spaetere Umbenennung).
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          continue_on_error: true
          data:
            title: !input push_titel
            message: "{{ push_text }}"
            data: "{{ push_extra }}"

  # 8. Zusaetzliche frei definierte Aktionen
  - alias: Zusatzaktion bei Erfolg oder Fehlschlag
    if:
      - condition: template
        value_template: "{{ erfolg }}"
    then: !input aktion_bei_erfolg
    else: !input aktion_bei_fehler
