blueprint:
  name: 🗓️⏰ Zeitschaltuhr mit Schaltbestätigung
  author: Torsten Wilms
  source_url: https://github.com/Toutzn/ha-blueprints/blob/main/blueprints/automation/zeitschaltuhr_mit_bestaetigung.yaml
  homeassistant:
    min_version: "2024.10.0"
  description: >-
    Schaltet Entitäten nach Sonnenstand, Uhrzeit oder eigenen Bedingungen – und prüft
    nach, ob der Befehl wirklich angekommen ist.


    **Zeitfenster:** Beginn und Ende werden direkt hier eingestellt – Sonnenuntergang
    oder feste Uhrzeit, jeweils mit Versatz in Minuten. Über Mitternacht hinweg ist
    ausdrücklich erlaubt.


    **Schaltrichtung:** Das Fenster darf auch nur in eine Richtung wirken. „Nur
    ausschalten" macht daraus eine Sperre – im Fenster schaltest du frei, außerhalb wird
    konsequent abgeschaltet.


    **Schaltbestätigung:** Nach jedem Befehl wird der Ist-Zustand zurückgelesen und
    gezielt für die Entitäten wiederholt, die nicht reagiert haben. Zusätzlich prüft die
    Automation zyklisch und nach jedem Neustart nach – verlorene Funkbefehle, kurz nicht
    erreichbare Aktoren und verpasste Schaltzeitpunkte fallen damit nicht durchs Raster.


    **Von Hand übersteuern:** Zwei optionale Ebenen. Der Master-Schalter ist der Stecker
    und hat Vorrang; die Betriebsart entscheidet, ob die Automatik überhaupt regiert.
  domain: automation

  input:
    # =====================================================================
    fenster:
      name: 1 · Wann geschaltet werden soll
      icon: mdi:weather-sunset
      collapsed: false
      input:
        fenster_start:
          name: Einschalten ab
          description: >-
            Der Beginn des Zeitfensters.


            „Kein Fenster" heißt: die Zeit spielt keine Rolle, es zählen nur die
            Bedingungen aus Abschnitt 2.
          default: keins
          selector:
            select:
              mode: list
              options:
                - label: "Kein Fenster"
                  value: keins
                - label: "Sonnenuntergang"
                  value: sonnenuntergang
                - label: "Feste Uhrzeit"
                  value: uhrzeit

        fenster_su_offset:
          name: Versatz zum Sonnenuntergang
          description: >-
            Minuten vor (negativ) oder nach (positiv) dem Sonnenuntergang.
            Trage die Minuten im Feld *Minuten* ein; das Minuszeichen macht daraus
            „vorher". −30 = eine halbe Stunde vor Sonnenuntergang, in der Dämmerung.
            +20 = zwanzig Minuten danach, wenn es schon dunkler ist.


            Nur wirksam, wenn oben „Sonnenuntergang" gewählt ist.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: false
              allow_negative: true

        fenster_start_uhrzeit:
          name: Uhrzeit für den Beginn
          description: >-
            Nur wirksam, wenn oben „Feste Uhrzeit" gewählt ist.
          default: "23:00:00"
          selector:
            time:

        fenster_ende:
          name: Ausschalten ab
          description: >-
            Das Ende des Zeitfensters.


            Beide Felder – Beginn und Ende – müssen gesetzt sein. Steht eines auf „Kein
            Fenster", wird das ganze Fenster ignoriert.
          default: keins
          selector:
            select:
              mode: list
              options:
                - label: "Kein Fenster"
                  value: keins
                - label: "Sonnenaufgang"
                  value: sonnenaufgang
                - label: "Feste Uhrzeit"
                  value: uhrzeit

        fenster_sa_offset:
          name: Versatz zum Sonnenaufgang
          description: >-
            Minuten vor (negativ) oder nach (positiv) dem Sonnenaufgang.
            Trage die Minuten im Feld *Minuten* ein; das Minuszeichen macht daraus
            „vorher". +30 = eine halbe Stunde nach Sonnenaufgang, wenn es sicher hell
            ist. −20 = zwanzig Minuten vorher, in der Morgendämmerung.


            Nur wirksam, wenn oben „Sonnenaufgang" gewählt ist.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: false
              allow_negative: true

        fenster_ende_uhrzeit:
          name: Uhrzeit für das Ende
          description: >-
            Nur wirksam, wenn oben „Feste Uhrzeit" gewählt ist. Liegt sie vor dem
            Beginn, läuft das Fenster über Mitternacht – „ab Sonnenuntergang, aus um
            01:00" ist also genau so gemeint.
          default: "01:00:00"
          selector:
            time:

        schaltrichtung:
          name: Schaltrichtung
          description: >-
            *Beides* – die gewöhnliche Zeitschaltuhr: im Fenster ein, außerhalb aus.


            *Nur ausschalten* – eine Sperre: im Fenster bleibt das Schalten dir
            überlassen, außerhalb wird konsequent abgeschaltet. Für Außenlicht, das
            tagsüber nichts zu suchen hat.


            *Nur einschalten* – die Automatik schaltet ein, das Ausschalten bleibt dir
            überlassen.


            Master-Schalter und Betriebsart (Abschnitt 4) behalten ihr eigenes
            Verhalten – ein dort eingestelltes Zwangs-Aus greift unabhängig hiervon.
          default: beides
          selector:
            select:
              mode: list
              options:
                - label: "Beides – ein und aus"
                  value: beides
                - label: "Nur ausschalten – Sperre außerhalb des Fensters"
                  value: nur_ausschalten
                - label: "Nur einschalten – Ausschalten bleibt dir überlassen"
                  value: nur_einschalten

    # =====================================================================
    bedingungen:
      name: 2 · Zusätzliche Bedingungen
      icon: mdi:playlist-check
      collapsed: true
      input:
        zeitquellen:
          name: Weitere Zeitquellen (optional)
          description: >-
            Für alles, was das Zeitfenster oben nicht abdeckt: Wochentage und mehrere
            Blöcke pro Tag (`schedule.*`-Helfer), Anwesenheit, Kalender, eigene
            Template-Binärsensoren.


            Jede Entität mit `on`/`off` ist erlaubt. `on` heißt „soll an sein".
            **Leer lassen**, wenn das Zeitfenster genügt.


            Nicht geeignet sind Entitäten ohne `on`/`off`-Zustand – `sun.sun`
            (`above_horizon`), `person.*` oder `device_tracker.*` (`home`). Dafür einen
            Template-Binärsensor anlegen; Rezepte stehen in der Doku.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: schedule
                - domain: binary_sensor
                - domain: input_boolean
                - domain: switch
                - domain: light
                - domain: fan
                - domain: calendar
                - domain: group
                - domain: automation

        zeitquellen_verknuepfung:
          name: Verknüpfung
          description: >-
            Wie Zeitfenster und Zeitquellen zusammenwirken. Das Fenster zählt dabei wie
            eine weitere Quelle.


            *ODER* addiert Zeiträume: eine Quelle `on` genügt. *UND* kombiniert
            Bedingungen: alle müssen `on` sein – etwa „nur im Fenster **und** nur wenn
            jemand zu Hause ist".
          default: oder
          selector:
            select:
              mode: list
              options:
                - label: "ODER – eine genügt"
                  value: oder
                - label: "UND – alle müssen zutreffen"
                  value: und

    # =====================================================================
    lasten:
      name: 3 · Was geschaltet wird
      icon: mdi:power-plug-outline
      collapsed: false
      input:
        ziele:
          name: Zu schaltende Entitäten
          description: >-
            Bewusst Entitäten statt Geräte: nur so lässt sich der Ist-Zustand
            zurücklesen und damit überhaupt prüfen, ob geschaltet wurde.
          selector:
            entity:
              multiple: true
              filter:
                - domain: switch
                - domain: light
                - domain: input_boolean
                - domain: fan
                - domain: media_player

        ziel_trigger:
          name: Sofort nachregeln, wenn fremd geschaltet wird
          description: >-
            Horcht auf die Ziel-Entitäten selbst. Schaltet jemand von Hand, per Szene
            oder Sprachassistent, bewertet die Automation die Lage augenblicklich neu –
            statt bis zum nächsten Nachprüf-Durchlauf zu warten.


            Für eine Sperre („nur ausschalten") der Unterschied zwischen „geht sofort
            wieder aus" und „brennt noch ein paar Minuten". Für eine gewöhnliche
            Zeitschaltuhr meist überflüssig.
          default: false
          selector:
            boolean:

    # =====================================================================
    schalter:
      name: 4 · Von Hand übersteuern
      icon: mdi:toggle-switch-outline
      collapsed: true
      input:
        master_entitaeten:
          name: Master-Schalter (optional)
          description: >-
            Die oberste Ebene – sinnbildlich der Stecker. Alle hier gewählten Entitäten
            müssen `on` sein, damit überhaupt etwas läuft, z. B.
            `input_boolean.poolsaison`. Hat Vorrang vor allem anderen.


            Leer lassen, wenn nicht benötigt.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: switch
                - domain: schedule

        verhalten_bei_master_aus:
          name: … und wenn der Master aus ist?
          description: >-
            „Stecker gezogen" bedeutet üblicherweise, dass die Last aus soll.
          default: ausschalten
          selector:
            select:
              mode: list
              options:
                - label: "Zwangs-Aus – Ziele werden ausgeschaltet"
                  value: ausschalten
                - label: "Handbetrieb – Automatik hält sich komplett raus"
                  value: handbetrieb

        aktiv_schalter:
          name: Zeitschaltuhr aktiv (optional)
          description: >-
            Die Betriebsart. Alle hier gewählten Entitäten müssen `on` sein, damit die
            Automatik regiert.


            Leer lassen, wenn es keinen Handbetrieb geben soll. Bei Schaltrichtung „nur
            ausschalten" ist das ohnehin der Normalfall – innerhalb des Fensters hält
            sich die Automatik schon von selbst heraus.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: switch
                - domain: schedule

        verhalten_bei_zeitschaltuhr_aus:
          name: … und wenn die Betriebsart aus ist?
          description: >-
            Handbetrieb heißt: der aktuelle Zustand bleibt unangetastet und du schaltest
            frei.
          default: handbetrieb
          selector:
            select:
              mode: list
              options:
                - label: "Handbetrieb – Automatik hält sich komplett raus"
                  value: handbetrieb
                - label: "Zwangs-Aus – Ziele werden ausgeschaltet"
                  value: ausschalten

    # =====================================================================
    bestaetigung:
      name: 5 · Schaltbestätigung und Selbstheilung
      icon: mdi:check-decagram-outline
      collapsed: true
      input:
        pruefung_verzoegerung:
          name: Wartezeit vor der Nachprüfung
          description: >-
            Wie lange nach dem Schaltbefehl gewartet wird, bevor der Ist-Zustand gelesen
            wird. Bei Funk-Aktoren (Zigbee, Z-Wave, WLAN) lieber großzügiger.
          default: 10
          selector:
            number:
              min: 2
              max: 120
              step: 1
              unit_of_measurement: Sekunden
              mode: slider

        max_versuche:
          name: Maximale Schaltversuche
          description: >-
            Wiederholt wird nur für die Entitäten, die noch nicht reagiert haben.
          default: 5
          selector:
            number:
              min: 1
              max: 20
              step: 1
              mode: box

        nachpruefung:
          name: Zyklische Nachprüfung
          description: >-
            Prüft im Hintergrund laufend, ob Soll und Ist übereinstimmen, und korrigiert
            Abweichungen. Die Automation bricht sofort ab, wenn nichts zu tun ist – ein
            kurzes Intervall kostet also praktisch keine Leistung.


            Ausschalten, wenn manuelles Schalten während des Fensters unangetastet
            bleiben soll.
          default: true
          selector:
            boolean:

        sync_intervall:
          name: Intervall der Nachprüfung
          default: "/5"
          selector:
            select:
              options:
                - label: Jede Minute
                  value: "/1"
                - label: Alle 5 Minuten
                  value: "/5"
                - label: Alle 15 Minuten
                  value: "/15"
                - label: Alle 30 Minuten
                  value: "/30"

    # =====================================================================
    push:
      name: 6 · Benachrichtigungen aufs Handy
      icon: mdi:cellphone-message
      collapsed: true
      input:
        push_geraete_erfolg:
          name: Push bei Erfolg (optional)
          description: >-
            Geräte mit installierter Home-Assistant-App. Leer lassen = kein Push bei
            Erfolg – bei einer Zeitschaltuhr, die zweimal täglich schaltet, meist die
            bessere Wahl.
          default: []
          selector:
            device:
              integration: mobile_app
              multiple: true

        push_geraete_fehler:
          name: Push bei Fehlschlag (optional)
          description: >-
            Geräte, die eine Meldung erhalten, wenn der Schaltbefehl auch nach allen
            Versuchen nicht angekommen ist.
          default: []
          selector:
            device:
              integration: mobile_app
              multiple: true

        push_titel:
          name: Titel der Benachrichtigung
          description: >-
            Bei mehreren Automationen aus diesem Blueprint hilft ein sprechender Titel
            beim Auseinanderhalten, z. B. „Pool" oder „Gartenlicht".
          default: Zeitschaltuhr
          selector:
            text:

        fehler_melden:
          name: Fehlermeldungen aus der Nachprüfung
          description: >-
            Ein dauerhaft nicht erreichbares Gerät – abgestecktes Relais, zigbee2mqtt
            gestoppt – erzeugt sonst bei jedem Nachprüf-Durchlauf eine neue Meldung.


            „Unterdrücken" meldet nur, wenn ein echtes Ereignis der Auslöser war.
            Korrigiert wird weiterhin bei jedem Durchlauf, und Erfolgsmeldungen sind
            nicht betroffen – die kommen gerade dann, wenn es endlich geklappt hat.
          default: ereignisse
          selector:
            select:
              mode: list
              options:
                - label: "Unterdrücken – nur bei echten Ereignissen"
                  value: ereignisse
                - label: "Auch bei jedem Nachprüf-Durchlauf melden"
                  value: immer

        push_kritisch:
          name: Fehlschlag als kritische Benachrichtigung
          description: >-
            Lässt den Fehler-Push auch bei stummem oder auf „Nicht stören" gestelltem
            Telefon durch. Setzt die entsprechende Berechtigung in der Companion-App
            voraus. Gilt nie für den Erfolg.
          default: false
          selector:
            boolean:

    # =====================================================================
    meldungen:
      name: 7 · Eigene Aktionen
      icon: mdi:script-text-outline
      collapsed: true
      input:
        aktion_bei_erfolg:
          name: Aktion bei Erfolg
          description: >-
            Zusätzlich zum Push oben – läuft nur, wenn tatsächlich geschaltet wurde und
            alle Ziele den Soll-Zustand erreicht haben. Die Vorgabe schreibt lediglich
            ins Logbuch und kann gelöscht werden.


            **Das ist kein Benachrichtigungsfeld** – für Push aufs Handy ist Abschnitt 6
            zuständig.


            Nutzbare Variablen: `soll_zustand` (`on`/`off`), `grund_text` (Auslöser im
            Klartext), `ziel_liste`, `versuche`.
          default:
            - action: logbook.log
              data:
                name: Zeitschaltuhr
                message: >-
                  {{ grund_text }}: auf '{{ soll_zustand }}' geschaltet
                  ({{ versuche }} Versuch(e)) – {{ ziel_liste | join(', ') }}
          selector:
            action: {}

        aktion_bei_fehler:
          name: Aktion bei Fehlschlag
          description: >-
            Zusätzlich zum Push oben – läuft, wenn nach allen Versuchen noch Entitäten
            den Soll-Zustand nicht erreicht haben. Die Vorgabe erzeugt die
            Glocken-Meldung in der Oberfläche.


            Nutzbare Variablen: `soll_zustand`, `grund_text`, `restliche` (was nicht
            reagiert hat), `nicht_erreichbar`, `versuche`.
          default:
            - action: persistent_notification.create
              data:
                title: Zeitschaltuhr – Schaltfehler
                message: >-
                  {{ grund_text }}: konnte nach {{ versuche }} Versuch(en) nicht auf
                  '{{ soll_zustand }}' schalten – {{ restliche | join(', ') }}
          selector:
            action: {}

# ---------------------------------------------------------------------------

mode: queued
max: 10
max_exceeded: silent

triggers:
  # Regulärer Schaltzeitpunkt: eine Zeitquelle wechselt. Mit explizitem "to:", damit
  # reine Attributänderungen (z. B. next_event) die Automation nicht sinnlos starten.
  - trigger: state
    entity_id: !input zeitquellen
    to: "on"
    id: zeitquelle
  - trigger: state
    entity_id: !input zeitquellen
    to: "off"
    id: zeitquelle

  # Master oder Betriebsart geändert -> sofort neu bewerten
  - trigger: state
    entity_id: !input master_entitaeten
    to: ["on", "off"]
    id: schalter
  - trigger: state
    entity_id: !input aktiv_schalter
    to: ["on", "off"]
    id: schalter

  # Jemand hat an einer Ziel-Entität geschaltet - von Hand, per Szene, per Assistent.
  # Der Trigger ist immer aktiv; ob er verarbeitet wird, entscheidet "ziel_trigger"
  # weiter unten. Ein Trigger-Block lässt sich nicht per Eingabe abschalten.
  - trigger: state
    entity_id: !input ziele
    to: ["on", "off"]
    id: ziel

  # Kanten des eingebauten Fensters: die beiden Sonnenereignisse mit ihrem Versatz und
  # die beiden eingestellten Uhrzeiten. Alle vier feuern auch, wenn das Fenster gar nicht
  # benutzt wird - ein Trigger-Block lässt sich nicht per Eingabe weglassen. Solche Läufe
  # enden beim Soll-Ist-Vergleich, ohne zu schalten und ohne zu melden.
  - trigger: sun
    event: sunset
    offset: !input fenster_su_offset
    id: fenster
  - trigger: sun
    event: sunrise
    offset: !input fenster_sa_offset
    id: fenster
  - trigger: time
    at: !input fenster_start_uhrzeit
    id: fenster
  - trigger: time
    at: !input fenster_ende_uhrzeit
    id: fenster

  # Selbstheilung
  - trigger: homeassistant
    event: start
    id: neustart
  - trigger: time_pattern
    minutes: !input sync_intervall
    id: sync

conditions: []

variables:
  # ACHTUNG: Variablen auf dieser Ebene rendert Home Assistant zum TRIGGER-Zeitpunkt,
  # nicht beim Ausführen. Bei "mode: queued" wartet ein zweiter Lauf in der Schlange,
  # rechnet aber mit dem Zustand von vor der Wartezeit. Hier stehen deshalb nur
  # statische Eingaben - jede Entscheidung fällt unten in den Aktionen.
  v_quellen: !input zeitquellen
  v_verknuepfung: !input zeitquellen_verknuepfung
  v_richtung: !input schaltrichtung
  v_fenster_start: !input fenster_start
  v_fenster_ende: !input fenster_ende
  v_fenster_start_uhrzeit: !input fenster_start_uhrzeit
  v_fenster_ende_uhrzeit: !input fenster_ende_uhrzeit
  v_su_offset: !input fenster_su_offset
  v_sa_offset: !input fenster_sa_offset
  v_ziel_trigger: !input ziel_trigger
  v_aktiv: !input aktiv_schalter
  v_master: !input master_entitaeten
  v_verhalten_master: !input verhalten_bei_master_aus
  v_verhalten_uhr: !input verhalten_bei_zeitschaltuhr_aus
  v_nachpruefung: !input nachpruefung
  v_max_versuche: !input max_versuche
  v_push_erfolg: !input push_geraete_erfolg
  v_push_fehler: !input push_geraete_fehler
  v_push_kritisch: !input push_kritisch
  v_fehler_melden: !input fehler_melden

  ziel_liste: !input ziele

actions:
  # 1. Zyklische Nachprüfung abgeschaltet? Dann nur echte Ereignisse verarbeiten.
  - alias: Nachprüfung respektieren
    condition: template
    value_template: >-
      {{ trigger is not defined
         or (trigger.id | default('manuell')) != 'sync'
         or v_nachpruefung }}

  # 1b. Ziel-Trigger nur verarbeiten, wenn er eingeschaltet ist. Steht hier und nicht
  #     in "conditions", weil bei "mode: queued" nichts abgebrochen wird - ein neuer
  #     Lauf reiht sich nur ein. (Bei "mode: restart" müsste es in "conditions".)
  - alias: Ziel-Trigger respektieren
    condition: template
    value_template: >-
      {{ trigger is not defined
         or (trigger.id | default('manuell')) != 'ziel'
         or v_ziel_trigger }}

  # 2. Lagebild ERST JETZT erheben - beim Ausführen, nicht beim Auslösen.
  #    Wartete dieser Lauf in der Warteschlange, hat der vorherige eventuell schon
  #    geschaltet; dann muss hier der neue Ist-Zustand herauskommen, nicht der alte.
  - alias: Soll-Zustand ermitteln
    variables:
      # Ist das eingebaute Fenster überhaupt konfiguriert? Beide Kanten müssen gesetzt
      # sein - ein halbes Fenster hat keinen definierten Zustand.
      fenster_konfiguriert: >-
        {{ v_fenster_start != 'keins' and v_fenster_ende != 'keins' }}

      # Der eingestellte Versatz in Sekunden. Der Duration-Selektor liefert ein
      # Dictionary; eine blanke Zahl (von Hand in die YAML geschrieben) gilt als
      # Sekunden, wie bei Home Assistants eigenem cv.time_period.
      o_sonnenuntergang: >-
        {% set o = v_su_offset %}
        {{ ((o.hours | int(0)) * 3600 + (o.minutes | int(0)) * 60 + (o.seconds | int(0)))
           if o is mapping else (o | int(0)) }}
      o_sonnenaufgang: >-
        {% set o = v_sa_offset %}
        {{ ((o.hours | int(0)) * 3600 + (o.minutes | int(0)) * 60 + (o.seconds | int(0)))
           if o is mapping else (o | int(0)) }}

      # Liegt "jetzt" im eingebauten Fenster? Beide Kanten werden auf einen konkreten
      # Zeitpunkt des heutigen Tages gebracht - Sonnenkanten aus next_setting /
      # next_rising plus Versatz, Uhrzeit-Kanten aus today_at(). Danach ist es ein
      # simpler Intervallvergleich; liegt das Ende vor dem Beginn, läuft das Fenster
      # über Mitternacht.
      fenster_an: >-
        {%- if not fenster_konfiguriert -%}false
        {%- else -%}
        {%- set jetzt = now() -%}
        {%- set nsu = state_attr('sun.sun', 'next_setting') | as_datetime | as_local -%}
        {%- set nsa = state_attr('sun.sun', 'next_rising') | as_datetime | as_local -%}
        {%- set su = nsu if nsu.date() == jetzt.date() else nsu - timedelta(days=1) -%}
        {%- set sa = nsa if nsa.date() == jetzt.date() else nsa - timedelta(days=1) -%}
        {%- set start = (su + timedelta(seconds=o_sonnenuntergang | int(0)))
             if v_fenster_start == 'sonnenuntergang' else today_at(v_fenster_start_uhrzeit) -%}
        {%- set ende = (sa + timedelta(seconds=o_sonnenaufgang | int(0)))
             if v_fenster_ende == 'sonnenaufgang' else today_at(v_fenster_ende_uhrzeit) -%}
        {{ (start <= jetzt < ende) if start < ende else (jetzt >= start or jetzt < ende) }}
        {%- endif -%}

      # Vorbedingung: haben alle Entscheidungs-Eingaben einen brauchbaren Zustand?
      # Beim HA-Start sind Entitäten kurz "unavailable" - dann darf NICHTS geschaltet
      # werden, sonst wird "weiß ich nicht" als "aus" missverstanden.
      eingaben_bekannt: >-
        {% set quellen = expand(v_quellen) | list %}
        {% set schalter = expand(v_master) | list + expand(v_aktiv) | list %}
        {{ (quellen | count > 0 or fenster_konfiguriert)
           and quellen | rejectattr('state', 'in', ['on', 'off']) | list | count == 0
           and schalter | rejectattr('state', 'in', ['on', 'off']) | list | count == 0 }}

      # Ebene 1: sind alle Master-Schalter "on"? (leere Liste = ja)
      master_ok: >-
        {{ expand(v_master) | selectattr('state', 'ne', 'on') | list | count == 0 }}

      # Ebene 2: sind alle Betriebsart-Schalter "on"? (leere Liste = ja)
      uhr_ok: >-
        {{ expand(v_aktiv) | selectattr('state', 'ne', 'on') | list | count == 0 }}

      # Ebene 3: sagen die Zeitquellen "an"? ODER = eine genügt, UND = alle müssen.
      # Das eingebaute Fenster zählt dabei wie eine weitere Zeitquelle mit.
      quelle_an: >-
        {% set an = expand(v_quellen) | selectattr('state', 'eq', 'on') | list | count %}
        {% set alle = expand(v_quellen) | list | count %}
        {% set an = an + (1 if (fenster_konfiguriert and fenster_an) else 0) %}
        {% set alle = alle + (1 if fenster_konfiguriert else 0) %}
        {{ an > 0 if v_verknuepfung == 'oder' else (alle > 0 and an == alle) }}

      # Soll-Zustand: 'on', 'off' oder 'egal' (= Automatik ist nicht zuständig).
      # Unbekannte Zustände zuerst, dann Master, dann Betriebsart, dann die Zeitquellen.
      soll_zustand: >-
        {% if not eingaben_bekannt %}egal{% elif not master_ok %}{{ 'off' if v_verhalten_master == 'ausschalten' else 'egal' }}{% elif not uhr_ok %}{{ 'off' if v_verhalten_uhr == 'ausschalten' else 'egal' }}{% elif quelle_an %}{{ 'egal' if v_richtung == 'nur_ausschalten' else 'on' }}{% else %}{{ 'egal' if v_richtung == 'nur_einschalten' else 'off' }}{% endif %}

      # Auslöser, maschinenlesbar
      grund: >-
        {% if not eingaben_bekannt %}unbekannt{% elif not master_ok %}master_aus{% elif not uhr_ok %}zeitschaltuhr_aus{% elif trigger is defined and (trigger.id | default('')) == 'ziel' %}nachgeregelt{% else %}zeitquelle{% endif %}

      # Zählt die Schaltversuche. Vorgabe 0, falls die Schleife gar nicht erst anläuft
      # (etwa weil alle Ziele unerreichbar sind).
      versuche: 0

      # Darf dieser Lauf Fehler melden? Nachprüf-Ticks schweigen auf Wunsch.
      melden_erlaubt: >-
        {{ v_fehler_melden == 'immer'
           or trigger is not defined
           or (trigger.id | default('manuell')) != 'sync' }}

      # Auslöser im Klartext, für Meldungen
      grund_text: >-
        {% if grund == 'unbekannt' %}Zustand nicht verfügbar{% elif grund == 'master_aus' %}Master-Schalter aus{% elif grund == 'zeitschaltuhr_aus' %}Zeitschaltuhr deaktiviert{% elif grund == 'nachgeregelt' %}Von Hand geschaltet{% else %}Zeitquelle{% endif %}

  # 3. Ist die Automatik überhaupt zuständig? ('egal' = Handbetrieb)
  - alias: Nur handeln, wenn ein Soll-Zustand definiert ist
    condition: template
    value_template: "{{ soll_zustand in ['on', 'off'] }}"

  # 4. Gibt es etwas zu tun oder zu melden? Fängt zugleich den Fall ab, dass ein
  #    vorheriger Lauf die Arbeit schon erledigt hat.
  #
  #    WICHTIG: "nicht im Soll" und "nicht erreichbar" sind zwei verschiedene Dinge.
  #    Ein Gerät mit Zustand 'unavailable' laesst sich nicht schalten - es wiederholt
  #    anzufunken kostet nur Zeit. Es wird deshalb getrennt gezählt und getrennt gemeldet.
  - alias: Nur handeln, wenn es etwas zu schalten oder zu melden gibt
    condition: template
    value_template: >-
      {% set schaltbar = expand(ziel_liste)
           | selectattr('state', 'in', ['on', 'off'])
           | selectattr('state', 'ne', soll_zustand) | list | count %}
      {% set weg = expand(ziel_liste)
           | rejectattr('state', 'in', ['on', 'off']) | list | count %}
      {{ schaltbar > 0 or (weg > 0 and melden_erlaubt) }}

  # 5. Schalten, warten, nachprüfen – und nur die Nachzügler erneut anstoßen.
  #    "while" statt "until": die Bedingung wird VOR jedem Durchgang geprüft. Gibt es
  #    nichts Schaltbares, läuft die Schleife null Mal - kein Leerbefehl, keine Wartezeit.
  - alias: Schalten mit Wiederholung
    repeat:
      sequence:
        # Zähler mitschreiben - "repeat.index" ist nach der Schleife nicht mehr verfügbar
        - variables:
            versuche: "{{ repeat.index }}"
        - action: "homeassistant.turn_{{ soll_zustand }}"
          continue_on_error: true
          target:
            entity_id: >-
              {{ expand(ziel_liste)
                 | selectattr('state', 'in', ['on', 'off'])
                 | selectattr('state', 'ne', soll_zustand)
                 | map(attribute='entity_id') | list }}
        - delay:
            seconds: !input pruefung_verzoegerung
      while:
        - condition: template
          value_template: >-
            {{ expand(ziel_liste)
                 | selectattr('state', 'in', ['on', 'off'])
                 | selectattr('state', 'ne', soll_zustand) | list | count > 0
               and repeat.index <= v_max_versuche }}

  # 6. Ergebnis auswerten - getrennt nach "reagiert nicht" und "gar nicht da"
  - variables:
      restliche: >-
        {{ expand(ziel_liste)
                 | selectattr('state', 'in', ['on', 'off'])
                 | selectattr('state', 'ne', soll_zustand)
                 | map(attribute='entity_id') | list }}
      nicht_erreichbar: >-
        {{ expand(ziel_liste)
                 | rejectattr('state', 'in', ['on', 'off'])
                 | map(attribute='entity_id') | list }}
      erfolg: >-
        {{ restliche | count == 0 and nicht_erreichbar | count == 0 }}

  # 7. Push an die ausgewählten Geräte. Leere Liste = keine Runde, kein Versand.
  - variables:
      # Erfolg geht immer raus. Fehler nur, wenn dieser Lauf melden darf.
      push_ziele: >-
        {% if erfolg %}{{ v_push_erfolg }}{% elif melden_erlaubt %}{{ v_push_fehler }}{% else %}{{ [] }}{% endif %}
      push_text: >-
        {% set n = versuche | int(0) %}{% set s = 'Schaltversuch' if n == 1 else 'Schaltversuchen' %}{% if erfolg %}{{ grund_text }}: auf '{{ soll_zustand }}' geschaltet – nach {{ n }} {{ s }}{% else %}{{ grund_text }}: {% if restliche | count > 0 %}{{ restliche | join(', ') }} reagiert nicht auf '{{ soll_zustand }}' (nach {{ n }} {{ s }}){% if nicht_erreichbar | count > 0 %}; {% endif %}{% endif %}{% if nicht_erreichbar | count > 0 %}nicht erreichbar: {{ nicht_erreichbar | join(', ') }}{% endif %}{% endif %}
      # Gleicher Tag pro Automation: eine neue Meldung ersetzt die vorige,
      # statt eine weitere Zeile im Mitteilungszentrum anzulegen.
      push_tag: "zeitschaltuhr_{{ ziel_liste | join('_') | slugify }}"
      push_extra: >-
        {% if not erfolg and v_push_kritisch %}{{ {'tag': push_tag, 'push': {'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}}} }}{% else %}{{ {'tag': push_tag} }}{% endif %}

  - alias: Push-Benachrichtigung senden
    repeat:
      for_each: "{{ push_ziele }}"
      sequence:
        # Der Notify-Dienst der Companion-App heisst notify.mobile_app_<Geraetename>.
        # device_attr(...,'name') liefert den Namen bei der Registrierung - genau den,
        # aus dem der Dienstname gebildet wurde (nicht die spaetere Umbenennung).
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          continue_on_error: true
          data:
            title: !input push_titel
            message: "{{ push_text }}"
            data: "{{ push_extra }}"

  # 8. Zusaetzliche frei definierte Aktionen
  - alias: Zusatzaktion bei Erfolg oder Fehlschlag
    if:
      - condition: template
        value_template: "{{ erfolg }}"
    then: !input aktion_bei_erfolg
    else: !input aktion_bei_fehler
