blueprint:
  name: Zeitschaltuhr mit Schaltbestätigung
  author: Torsten Wilms
  source_url: https://github.com/Toutzn/ha-blueprints/blob/main/blueprints/automation/zeitschaltuhr_mit_bestaetigung.yaml
  homeassistant:
    min_version: "2024.10.0"
  description: >-
    Schaltet beliebige Entitäten nach einem Schedule-Helfer ein und aus – und prüft
    danach nach, ob es wirklich geklappt hat.


    **Ablauf:** Zeitschaltuhr aktiv? → Freigaben erfüllt? → sagt der Zeitplan „an"
    oder „aus"? → weicht der Ist-Zustand vom Soll ab? → schalten, warten,
    nachprüfen, bei Bedarf wiederholen → Erfolg oder Fehlschlag melden.


    **Selbstheilend:** Zusätzlich zu den Schaltzeitpunkten prüft die Automation
    zyklisch und nach jedem Home-Assistant-Neustart nach. Damit fallen verlorene
    Funkbefehle, kurz nicht erreichbare Aktoren und verpasste Trigger (Neustart,
    Reload) nicht mehr durchs Raster.


    **Wichtig zur Nachprüfung:** Solange die Zeitschaltuhr aktiv ist, setzt die
    zyklische Nachprüfung den Soll-Zustand auch gegen manuelles Schalten durch.
    Für Handbetrieb den Aktiv-Schalter ausschalten – oder die Nachprüfung
    deaktivieren.
  domain: automation

  input:
    zeit:
      name: Zeitsteuerung
      icon: mdi:calendar-clock
      collapsed: false
      input:
        zeitplan:
          name: Zeitplan
          description: >-
            Der Schedule-Helfer, der die Schaltzeiten vorgibt. `on` = Ziel-Entitäten
            sollen an sein, `off` = aus. Wochentage und mehrere Blöcke pro Tag
            konfigurierst du direkt im Helfer.
          selector:
            entity:
              filter:
                - domain: schedule

    freigaben:
      name: Freigaben
      icon: mdi:toggle-switch-outline
      collapsed: false
      input:
        aktiv_schalter:
          name: Zeitschaltuhr aktiv
          description: >-
            Hauptschalter der Zeitschaltuhr. Steht er auf `off`, greift das unten
            gewählte Verhalten bei deaktivierter Zeitschaltuhr.
          selector:
            entity:
              filter:
                - domain: input_boolean

        freigabe_entitaeten:
          name: Zusätzliche Freigaben (optional)
          description: >-
            Alle hier gewählten Entitäten müssen `on` sein, damit die Zeitschaltuhr
            schaltet – z. B. ein `input_boolean.poolsaison`. Leer lassen, wenn nicht
            benötigt.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: switch
                - domain: schedule

        verhalten_bei_deaktivierung:
          name: Verhalten bei deaktivierter Zeitschaltuhr
          description: >-
            Was passiert, wenn der Aktiv-Schalter oder eine Freigabe auf `off` steht.
          default: handbetrieb
          selector:
            select:
              mode: list
              options:
                - label: "Handbetrieb – Automatik hält sich komplett raus"
                  value: handbetrieb
                - label: "Zwangs-Aus – Ziel-Entitäten werden ausgeschaltet"
                  value: ausschalten

    schalten:
      name: Schalten und Nachprüfen
      icon: mdi:check-decagram-outline
      collapsed: false
      input:
        ziele:
          name: Zu schaltende Entitäten
          description: >-
            Diese Entitäten werden geschaltet und einzeln auf Erfolg geprüft.
            Bewusst Entitäten statt Geräte: nur so lässt sich der Ist-Zustand
            zurücklesen.
          selector:
            entity:
              multiple: true
              filter:
                - domain: switch
                - domain: light
                - domain: input_boolean
                - domain: fan
                - domain: media_player

        pruefung_verzoegerung:
          name: Wartezeit vor der Nachprüfung
          description: >-
            Wie lange nach dem Schaltbefehl gewartet wird, bevor der Ist-Zustand
            geprüft wird. Bei Funk-Aktoren (Zigbee, Z-Wave, WLAN) lieber etwas
            großzügiger.
          default: 10
          selector:
            number:
              min: 2
              max: 120
              step: 1
              unit_of_measurement: Sekunden
              mode: slider

        max_versuche:
          name: Maximale Schaltversuche
          description: >-
            Wie oft der Schaltbefehl wiederholt wird, solange der Ist-Zustand nicht
            passt. Wiederholt wird nur für die Entitäten, die noch nicht reagiert haben.
          default: 5
          selector:
            number:
              min: 1
              max: 20
              step: 1
              mode: box

        nachpruefung:
          name: Zyklische Nachprüfung aktiv
          description: >-
            Prüft im Hintergrund laufend, ob Soll- und Ist-Zustand übereinstimmen,
            und korrigiert Abweichungen. Ausschalten, wenn du manuelles Schalten
            während des Zeitfensters erlauben willst.
          default: true
          selector:
            boolean:

        sync_intervall:
          name: Intervall der Nachprüfung
          description: >-
            Die Automation bricht sofort ab, wenn keine Abweichung besteht – ein
            kurzes Intervall kostet also praktisch keine Leistung.
          default: "/5"
          selector:
            select:
              options:
                - label: Jede Minute
                  value: "/1"
                - label: Alle 5 Minuten
                  value: "/5"
                - label: Alle 15 Minuten
                  value: "/15"
                - label: Alle 30 Minuten
                  value: "/30"

    meldungen:
      name: Meldungen
      icon: mdi:bell-outline
      collapsed: true
      input:
        aktion_bei_erfolg:
          name: Aktion bei Erfolg
          description: >-
            Läuft nur, wenn tatsächlich geschaltet wurde und alle Ziel-Entitäten den
            Soll-Zustand erreicht haben. Nutzbare Variablen: `soll_zustand`
            (`on`/`off`), `ziel_liste` (alle Ziele), `versuche` (Anzahl Schaltversuche).
          default:
            - action: logbook.log
              data:
                name: Zeitschaltuhr
                message: >-
                  Schaltvorgang auf '{{ soll_zustand }}' erfolgreich
                  ({{ versuche }} Versuch(e)): {{ ziel_liste | join(', ') }}
          selector:
            action: {}

        aktion_bei_fehler:
          name: Aktion bei Fehlschlag
          description: >-
            Läuft, wenn nach allen Versuchen noch Entitäten den Soll-Zustand nicht
            erreicht haben. Nutzbare Variablen: `soll_zustand`, `restliche`
            (Entitäten, die nicht reagiert haben), `versuche`.
          default:
            - action: persistent_notification.create
              data:
                title: Zeitschaltuhr – Schaltfehler
                message: >-
                  Konnte nach {{ versuche }} Versuch(en) nicht auf
                  '{{ soll_zustand }}' schalten: {{ restliche | join(', ') }}
          selector:
            action: {}

# ---------------------------------------------------------------------------

mode: queued
max: 10
max_exceeded: silent

triggers:
  # Regulärer Schaltzeitpunkt: Zeitplan wechselt. Mit explizitem "to:", damit
  # reine Attributänderungen (z. B. next_event) die Automation nicht sinnlos starten.
  - trigger: state
    entity_id: !input zeitplan
    to: "on"
    id: zeitplan
  - trigger: state
    entity_id: !input zeitplan
    to: "off"
    id: zeitplan

  # Aktiv-Schalter oder Freigaben geändert -> sofort neu bewerten
  - trigger: state
    entity_id: !input aktiv_schalter
    to: ["on", "off"]
    id: freigabe
  - trigger: state
    entity_id: !input freigabe_entitaeten
    to: ["on", "off"]
    id: freigabe

  # Selbstheilung
  - trigger: homeassistant
    event: start
    id: neustart
  - trigger: time_pattern
    minutes: !input sync_intervall
    id: sync

conditions: []

variables:
  v_zeitplan: !input zeitplan
  v_aktiv: !input aktiv_schalter
  v_freigaben: !input freigabe_entitaeten
  v_verhalten: !input verhalten_bei_deaktivierung
  v_nachpruefung: !input nachpruefung
  v_max_versuche: !input max_versuche

  ziel_liste: !input ziele

  # Sind Aktiv-Schalter UND alle zusätzlichen Freigaben "on"?
  freigegeben: >-
    {{ is_state(v_aktiv, 'on')
       and expand(v_freigaben) | selectattr('state', 'ne', 'on') | list | count == 0 }}

  # Soll-Zustand: 'on', 'off' oder 'egal' (= Automatik ist nicht zuständig)
  soll_zustand: >-
    {% if freigegeben %}{{ 'on' if is_state(v_zeitplan, 'on') else 'off' }}{% elif v_verhalten == 'ausschalten' %}off{% else %}egal{% endif %}

  # Ziel-Entitäten, die aktuell nicht im Soll-Zustand sind
  abweichend: >-
    {{ expand(ziel_liste)
       | selectattr('state', 'ne', soll_zustand)
       | map(attribute='entity_id') | list }}

actions:
  # 1. Zyklische Nachprüfung abgeschaltet? Dann nur echte Ereignisse verarbeiten.
  - alias: Nachprüfung respektieren
    condition: template
    value_template: >-
      {{ trigger is not defined
         or (trigger.id | default('manuell')) != 'sync'
         or v_nachpruefung }}

  # 2. Ist die Automatik überhaupt zuständig? ('egal' = Handbetrieb)
  - alias: Nur handeln, wenn ein Soll-Zustand definiert ist
    condition: template
    value_template: "{{ soll_zustand in ['on', 'off'] }}"

  # 3. Stimmt der Ist-Zustand schon? Dann fertig – verhindert Meldungs-Spam.
  - alias: Nur handeln, wenn Soll und Ist abweichen
    condition: template
    value_template: "{{ abweichend | count > 0 }}"

  # 4. Schalten, warten, nachprüfen – und nur die Nachzügler erneut anstoßen.
  - alias: Schalten mit Wiederholung
    repeat:
      sequence:
        # Zähler mitschreiben - "repeat.index" ist nach der Schleife nicht mehr verfügbar
        - variables:
            versuche: "{{ repeat.index }}"
        - action: "homeassistant.turn_{{ soll_zustand }}"
          continue_on_error: true
          target:
            entity_id: >-
              {{ expand(ziel_liste)
                 | selectattr('state', 'ne', soll_zustand)
                 | map(attribute='entity_id') | list }}
        - delay:
            seconds: !input pruefung_verzoegerung
      until:
        - condition: template
          value_template: >-
            {{ expand(ziel_liste) | selectattr('state', 'ne', soll_zustand)
                 | list | count == 0
               or repeat.index >= v_max_versuche }}

  # 5. Ergebnis auswerten
  - variables:
      restliche: >-
        {{ expand(ziel_liste)
           | selectattr('state', 'ne', soll_zustand)
           | map(attribute='entity_id') | list }}

  - alias: Erfolg oder Fehlschlag melden
    if:
      - condition: template
        value_template: "{{ restliche | count == 0 }}"
    then: !input aktion_bei_erfolg
    else: !input aktion_bei_fehler
